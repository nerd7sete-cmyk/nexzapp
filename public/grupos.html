<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>NexZapp • Grupos</title>

<script src="/socket.io/socket.io.js"></script>

<link
href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
rel="stylesheet"
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--green:#22c55e;
--green2:#16a34a;

--bg:#050505;
--card:#0d0d0d;

--text:#fff;
--muted:#6b7280;

--border:
rgba(255,255,255,.05);

}

html,
body{

width:100%;
overflow-x:hidden;

}

body{

background:#050505;

font-family:'Inter',sans-serif;

color:#fff;

padding:
calc(16px + env(safe-area-inset-top))
16px
calc(30px + env(safe-area-inset-bottom));

}

/* CONTAINER */

.container{

width:100%;
max-width:1500px;
margin:auto;

}

/* TOP */

.top{

display:flex;
justify-content:space-between;
align-items:center;

gap:16px;

margin-bottom:18px;

flex-wrap:wrap;

}

.title{

display:flex;
align-items:center;
gap:14px;

}

.logo{

width:58px;
height:58px;

border-radius:18px;

background:#0d0d0d;

border:
1px solid var(--border);

display:flex;
align-items:center;
justify-content:center;

}

.logo i{

font-size:26px;
color:var(--green);

}

.title h1{

font-size:28px;
font-weight:800;

letter-spacing:-1px;

}

.title p{

margin-top:5px;

font-size:12px;
color:var(--muted);

}

/* STATUS */

.status{

display:flex;
align-items:center;
gap:10px;

padding:12px 16px;

border-radius:16px;

background:#0d0d0d;

border:
1px solid var(--border);

}

.dot{

width:11px;
height:11px;

border-radius:50%;

background:#ef4444;

}

.dot.online{

background:var(--green);

}

.status strong{

font-size:13px;

}

.status p{

font-size:11px;
color:var(--muted);

margin-top:3px;

}

/* STATS BAR */

.stats{

display:flex;
gap:12px;

overflow:auto;

padding-bottom:4px;

margin-bottom:18px;

}

.stats::-webkit-scrollbar{

height:4px;

}

.stats::-webkit-scrollbar-thumb{

background:#1f1f1f;

border-radius:20px;

}

.stat{

min-width:170px;

background:#0d0d0d;

border:
1px solid var(--border);

border-radius:18px;

padding:16px;

}

.stat-top{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:12px;

}

.stat-top i{

font-size:18px;
color:var(--green);

}

.stat-top span{

font-size:12px;
color:var(--muted);

}

.stat h2{

font-size:28px;
font-weight:800;

}

.stat p{

margin-top:5px;

font-size:11px;
color:#6b7280;

}

/* MAIN */

.main{

background:#0d0d0d;

border:
1px solid var(--border);

border-radius:28px;

padding:18px;

}

/* TABS */

.tabs{

display:flex;
gap:10px;

overflow:auto;

padding-bottom:4px;

margin-bottom:18px;

}

.tabs::-webkit-scrollbar{

height:4px;

}

.tabs::-webkit-scrollbar-thumb{

background:#1f1f1f;

border-radius:20px;

}

.tab{

height:52px;

padding:0 18px;

border:none;

border-radius:16px;

background:#111;

border:
1px solid rgba(255,255,255,.05);

color:#fff;

display:flex;
align-items:center;
gap:10px;

cursor:pointer;

white-space:nowrap;

transition:.2s;

font-size:13px;
font-weight:700;

}

.tab.active{

background:
linear-gradient(
135deg,
rgba(34,197,94,.14),
rgba(34,197,94,.05)
);

border:
1px solid rgba(34,197,94,.18);

}

.tab-count{

padding:5px 9px;

border-radius:10px;

background:#181818;

font-size:11px;

}

/* SEARCH */

.search-box{

margin-bottom:18px;

}

.search{

width:100%;

height:58px;

background:#111;

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

padding:0 18px;

color:#fff;

font-size:14px;

outline:none;

}

.search:focus{

border-color:
rgba(34,197,94,.18);

}

/* ACTIONS */

.actions{

display:flex;
gap:10px;

margin-bottom:18px;

flex-wrap:wrap;

}

.action{

height:52px;

padding:0 18px;

border:none;

border-radius:16px;

cursor:pointer;

font-size:13px;
font-weight:700;

display:flex;
align-items:center;
gap:10px;

transition:.2s;

}

.action:hover{

transform:translateY(-1px);

}

.primary{

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

color:#fff;

}

.dark{

background:#111;

border:
1px solid rgba(255,255,255,.05);

color:#fff;

}

/* GROUPS */

.groups{

display:flex;
flex-direction:column;

gap:12px;

}

/* GROUP */

.group{

background:#111;

border:
1px solid rgba(255,255,255,.04);

border-radius:20px;

padding:14px;

display:flex;
justify-content:space-between;
align-items:center;

gap:14px;

transition:.2s;

}

.group:hover{

border-color:
rgba(34,197,94,.14);

}

.group-left{

display:flex;
align-items:center;
gap:14px;

min-width:0;

}

.check{

width:20px;
height:20px;

accent-color:var(--green);

}

.avatar{

width:54px;
height:54px;

border-radius:16px;

background:#191919;

display:flex;
align-items:center;
justify-content:center;

flex-shrink:0;

}

.avatar i{

font-size:22px;
color:var(--green);

}

.info{

min-width:0;

}

.info h3{

font-size:14px;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

margin-bottom:5px;

}

.info p{

font-size:11px;
color:var(--muted);

}

.group-right{

display:flex;
align-items:center;
gap:10px;

}

.icon-btn{

width:44px;
height:44px;

border:none;

border-radius:14px;

background:#181818;

border:
1px solid rgba(255,255,255,.05);

color:#6b7280;

cursor:pointer;

transition:.2s;

}

.icon-btn:hover{

border-color:
rgba(34,197,94,.18);

color:#fff;

}

.favorite.active{

color:#facc15;

}

.hidden.active{

color:#ef4444;

}

/* EMPTY */

.empty{

height:300px;

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

gap:14px;

color:#6b7280;

}

.empty i{

font-size:54px;

}

/* MOBILE */

@media(max-width:700px){

body{

padding:14px;

}

.group{

flex-direction:column;
align-items:flex-start;

}

.group-right{

width:100%;
justify-content:flex-end;

}

.title h1{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="container">

<!-- TOP -->

<div class="top">

<div class="title">

<div class="logo">

<i class="ri-group-2-fill"></i>

</div>

<div>

<h1>
Central de Grupos
</h1>

<p>
Gerenciamento inteligente NexZapp
</p>

</div>

</div>

<div class="status">

<div
class="dot"
id="statusDot"
></div>

<div>

<strong id="statusText">
Conectando...
</strong>

<p id="statusSub">
Aguardando WhatsApp
</p>

</div>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-top">

<span>
Total
</span>

<i class="ri-group-line"></i>

</div>

<h2 id="totalGroups">
0
</h2>

<p>
Grupos sincronizados
</p>

</div>

<div class="stat">

<div class="stat-top">

<span>
Selecionados
</span>

<i class="ri-checkbox-circle-line"></i>

</div>

<h2 id="selectedGroups">
0
</h2>

<p>
Prontos para envio
</p>

</div>

<div class="stat">

<div class="stat-top">

<span>
Favoritos
</span>

<i class="ri-star-line"></i>

</div>

<h2 id="favoriteGroups">
0
</h2>

<p>
Fixados
</p>

</div>

<div class="stat">

<div class="stat-top">

<span>
Ocultos
</span>

<i class="ri-eye-off-line"></i>

</div>

<h2 id="hiddenGroups">
0
</h2>

<p>
Ocultados
</p>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- TABS -->

<div class="tabs">

<button
class="tab active"
id="tab-all"
onclick="trocarAba('all')"
>

<i class="ri-group-line"></i>

Todos

<div
class="tab-count"
id="countAll"
>
0
</div>

</button>

<button
class="tab"
id="tab-selected"
onclick="trocarAba('selected')"
>

<i class="ri-checkbox-circle-line"></i>

Selecionados

<div
class="tab-count"
id="countSelected"
>
0
</div>

</button>

<button
class="tab"
id="tab-favorites"
onclick="trocarAba('favorites')"
>

<i class="ri-star-line"></i>

Favoritos

<div
class="tab-count"
id="countFavorites"
>
0
</div>

</button>

<button
class="tab"
id="tab-hidden"
onclick="trocarAba('hidden')"
>

<i class="ri-eye-off-line"></i>

Ocultos

<div
class="tab-count"
id="countHidden"
>
0
</div>

</button>

</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
class="search"
id="search"
placeholder="Pesquisar grupos..."
>

</div>

<!-- ACTIONS -->

<div class="actions">

<button
class="action primary"
onclick="selecionarTodos()"
>

<i class="ri-checkbox-multiple-line"></i>

Selecionar Todos

</button>

<button
class="action dark"
onclick="limparSelecao()"
>

<i class="ri-close-circle-line"></i>

Limpar

</button>

<button
class="action dark"
onclick="atualizarGrupos()"
>

<i class="ri-refresh-line"></i>

Atualizar

</button>

</div>

<!-- GROUPS -->

<div
class="groups"
id="groups"
>

<div class="empty">

<i class="ri-loader-4-line"></i>

<span>
Carregando grupos...
</span>

</div>

</div>

</div>

</div>

<script>

const socket = io();

const groupsDiv =
document.getElementById(
'groups'
);

let abaAtual = 'all';

let todosGrupos = JSON.parse(

localStorage.getItem(
'todosGrupos'
)

) || [];

let gruposSelecionados = JSON.parse(

localStorage.getItem(
'gruposSelecionados'
)

) || [];

let gruposFavoritos = JSON.parse(

localStorage.getItem(
'gruposFavoritos'
)

) || [];

let gruposOcultos = JSON.parse(

localStorage.getItem(
'gruposOcultos'
)

) || [];

/* STATUS */

socket.on(
'ready',
()=>{

document
.getElementById(
'statusText'
)
.innerText =
'WhatsApp conectado';

document
.getElementById(
'statusSub'
)
.innerText =
'Sistema online';

document
.getElementById(
'statusDot'
)
.classList.add(
'online'
);

});

socket.on(
'groups',
(lista)=>{

todosGrupos = lista;

localStorage.setItem(

'todosGrupos',

JSON.stringify(lista)

);

renderizar();

});

/* SEARCH */

document
.getElementById(
'search'
)
.addEventListener(
'input',
renderizar
);

/* ABA */

function trocarAba(tipo){

abaAtual = tipo;

document
.querySelectorAll('.tab')
.forEach(tab=>{

tab.classList.remove(
'active'
);

});

document
.getElementById(
`tab-${tipo}`
)
.classList.add(
'active'
);

renderizar();

}

/* RENDER */

function renderizar(){

const busca =

document
.getElementById(
'search'
)
.value
.toLowerCase();

let lista = [...todosGrupos];

if(abaAtual === 'selected'){

lista = lista.filter(

g => gruposSelecionados.includes(g.id)

);

}

if(abaAtual === 'favorites'){

lista = lista.filter(

g => gruposFavoritos.includes(g.id)

);

}

if(abaAtual === 'hidden'){

lista = lista.filter(

g => gruposOcultos.includes(g.id)

);

}

if(abaAtual === 'all'){

lista = lista.filter(

g => !gruposOcultos.includes(g.id)

);

}

lista = lista.filter(group=>

group.name
.toLowerCase()
.includes(busca)

);

document
.getElementById(
'totalGroups'
)
.innerText =
todosGrupos.length;

document
.getElementById(
'selectedGroups'
)
.innerText =
gruposSelecionados.length;

document
.getElementById(
'favoriteGroups'
)
.innerText =
gruposFavoritos.length;

document
.getElementById(
'hiddenGroups'
)
.innerText =
gruposOcultos.length;

document
.getElementById(
'countAll'
)
.innerText =

todosGrupos.filter(
g => !gruposOcultos.includes(g.id)
).length;

document
.getElementById(
'countSelected'
)
.innerText =
gruposSelecionados.length;

document
.getElementById(
'countFavorites'
)
.innerText =
gruposFavoritos.length;

document
.getElementById(
'countHidden'
)
.innerText =
gruposOcultos.length;

if(!lista.length){

groupsDiv.innerHTML = `

<div class="empty">

<i class="ri-group-line"></i>

<span>
Nenhum grupo encontrado
</span>

</div>

`;

return;

}

groupsDiv.innerHTML = '';

lista.forEach(group=>{

const checked =
gruposSelecionados.includes(group.id);

const favorite =
gruposFavoritos.includes(group.id);

const hidden =
gruposOcultos.includes(group.id);

groupsDiv.innerHTML += `

<div class="group">

<div class="group-left">

<input
type="checkbox"
class="check"
value="${group.id}"
${checked ? 'checked' : ''}
onchange="salvarSelecionados()"
>

<div class="avatar">

<i class="ri-group-fill"></i>

</div>

<div class="info">

<h3>
${group.name}
</h3>

<p>
${group.id}
</p>

</div>

</div>

<div class="group-right">

<button
class="icon-btn favorite ${favorite ? 'active' : ''}"
onclick="toggleFavorito('${group.id}')"
>

<i class="${
favorite
? 'ri-star-fill'
: 'ri-star-line'
}"></i>

</button>

<button
class="icon-btn hidden ${hidden ? 'active' : ''}"
onclick="toggleOculto('${group.id}')"
>

<i class="${
hidden
? 'ri-eye-line'
: 'ri-eye-off-line'
}"></i>

</button>

</div>

</div>

`;

});

}

/* FAVORITO */

function toggleFavorito(id){

if(
gruposFavoritos.includes(id)
){

gruposFavoritos =

gruposFavoritos.filter(
g => g !== id
);

}else{

gruposFavoritos.push(id);

}

localStorage.setItem(

'gruposFavoritos',

JSON.stringify(
gruposFavoritos
)

);

renderizar();

}

/* OCULTO */

function toggleOculto(id){

if(
gruposOcultos.includes(id)
){

gruposOcultos =

gruposOcultos.filter(
g => g !== id
);

}else{

gruposOcultos.push(id);

}

localStorage.setItem(

'gruposOcultos',

JSON.stringify(
gruposOcultos
)

);

renderizar();

}

/* SELECT */

function salvarSelecionados(){

gruposSelecionados = [];

document
.querySelectorAll(
'.check:checked'
)
.forEach(check=>{

gruposSelecionados.push(
check.value
);

});

localStorage.setItem(

'gruposSelecionados',

JSON.stringify(
gruposSelecionados
)

);

renderizar();

}

function selecionarTodos(){

document
.querySelectorAll('.check')
.forEach(check=>{

check.checked = true;

});

salvarSelecionados();

}

function limparSelecao(){

document
.querySelectorAll('.check')
.forEach(check=>{

check.checked = false;

});

salvarSelecionados();

}

/* UPDATE */

function atualizarGrupos(){

socket.emit(
'reload-groups'
);

}

/* INIT */

renderizar();

</script>

</body>
</html>
