<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>NexZapp • Editar Campanha</title>

<link
href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
rel="stylesheet"
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--green:#22c55e;
--green2:#16a34a;

--red:#ef4444;

--bg:#020202;

--card:#080808;

--border:
rgba(255,255,255,.05);

--muted:#6b7280;

}

html,
body{

width:100%;
min-height:100%;

overflow:auto;

-webkit-overflow-scrolling:touch;

background:#020202;

font-family:'Inter',sans-serif;

color:#fff;

}

body{

padding:
calc(16px + env(safe-area-inset-top))
16px
calc(22px + env(safe-area-inset-bottom));

background:

radial-gradient(
circle at top left,
rgba(34,197,94,.06),
transparent 28%
),

radial-gradient(
circle at bottom right,
rgba(34,197,94,.04),
transparent 30%
),

#020202;

}

/* CONTAINER */

.container{

width:100%;

max-width:1800px;

margin:auto;

}

/* TOP */

.top{

display:flex;
justify-content:space-between;
align-items:center;

gap:18px;

margin-bottom:20px;

flex-wrap:wrap;

}

.title{

display:flex;
align-items:center;

gap:16px;

}

.title-icon{

width:72px;
height:72px;

border-radius:24px;

background:
rgba(255,255,255,.03);

border:
1px solid rgba(255,255,255,.05);

display:flex;
align-items:center;
justify-content:center;

}

.title-icon i{

font-size:34px;

color:var(--green);

}

.title h1{

font-size:38px;

font-weight:900;

letter-spacing:-1px;

}

.title p{

margin-top:6px;

font-size:13px;

color:var(--muted);

}

/* TOP BUTTONS */

.top-actions{

display:flex;

gap:12px;

flex-wrap:wrap;

}

.top-btn{

height:54px;

padding:0 22px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:13px;
font-weight:800;

display:flex;
align-items:center;
justify-content:center;

gap:10px;

transition:.2s;

}

.top-btn:hover{

transform:
translateY(-2px);

}

.btn-dark{

background:#0b0b0b;

border:
1px solid rgba(255,255,255,.05);

color:#fff;

}

.btn-primary{

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

color:#fff;

box-shadow:
0 12px 30px rgba(34,197,94,.18);

}

/* GRID */

.grid{

display:grid;

grid-template-columns:
1fr 430px;

gap:20px;

align-items:start;

}

/* CARD */

.card{

background:
linear-gradient(
180deg,
rgba(12,12,12,.96),
rgba(8,8,8,.96)
);

border:
1px solid rgba(255,255,255,.05);

border-radius:30px;

padding:22px;

overflow:hidden;

box-shadow:
0 20px 50px rgba(0,0,0,.35);

}

/* HEADER */

.card-header{

display:flex;
justify-content:space-between;
align-items:center;

gap:12px;

margin-bottom:22px;

flex-wrap:wrap;

}

.card-header h2{

font-size:24px;

font-weight:900;

}

.badge{

padding:10px 14px;

border-radius:14px;

background:
rgba(34,197,94,.08);

border:
1px solid rgba(34,197,94,.12);

font-size:11px;

font-weight:800;

color:#86efac;

}

/* FORM */

.form{

display:flex;
flex-direction:column;

}

/* INPUTS */

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

margin-bottom:10px;

font-size:13px;

font-weight:700;

}

.input,
.textarea{

width:100%;

background:#050505;

border:
1px solid rgba(255,255,255,.05);

border-radius:22px;

outline:none;

color:#fff;

font-family:'Inter',sans-serif;

transition:.2s;

}

.input{

height:58px;

padding:0 18px;

font-size:14px;

}

.textarea{

min-height:240px;

padding:18px;

resize:vertical;

line-height:1.7;

font-size:14px;

overflow:auto;

}

.input:focus,
.textarea:focus{

border-color:
rgba(34,197,94,.22);

box-shadow:
0 0 0 4px rgba(34,197,94,.08);

}

/* UPLOAD */

.upload{

background:#050505;

border:
1px dashed rgba(255,255,255,.08);

border-radius:24px;

padding:22px;

text-align:center;

margin-bottom:20px;

}

.upload i{

font-size:40px;

color:var(--green);

margin-bottom:10px;

}

.upload p{

font-size:12px;

color:var(--muted);

margin-bottom:16px;

}

.upload input{

width:100%;

color:#fff;

}

/* BUTTONS */

.buttons{

display:flex;

gap:12px;

margin-top:18px;

flex-wrap:wrap;

}

.btn{

flex:1;

height:56px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:13px;

font-weight:800;

display:flex;
align-items:center;
justify-content:center;

gap:10px;

transition:.2s;

}

.btn:hover{

transform:
translateY(-2px);

}

.save{

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

color:#fff;

}

.delete{

background:
linear-gradient(
135deg,
#ef4444,
#dc2626
);

color:#fff;

}

.cancel{

background:#0b0b0b;

border:
1px solid rgba(255,255,255,.05);

color:#fff;

}

/* PHONE */

.phone{

width:100%;

height:900px;

background:#111b21;

border-radius:34px;

overflow:hidden;

display:flex;
flex-direction:column;

border:
1px solid rgba(255,255,255,.05);

}

/* PHONE TOP */

.phone-top{

height:78px;

background:#202c33;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 18px;

flex-shrink:0;

}

.user{

display:flex;
align-items:center;

gap:12px;

}

.avatar{

width:44px;
height:44px;

border-radius:50%;

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

display:flex;
align-items:center;
justify-content:center;

font-weight:900;

}

.user h3{

font-size:14px;

margin-bottom:3px;

}

.user p{

font-size:11px;

color:#9ca3af;

}

.phone-icons{

display:flex;

gap:14px;

font-size:20px;

color:#d1d5db;

}

/* CHAT */

.chat{

flex:1;

position:relative;

padding:18px;

overflow-y:auto;

-webkit-overflow-scrolling:touch;

display:flex;
justify-content:flex-start;
align-items:flex-start;

background:
url('https://i.ibb.co/4wVfYX1Z/Whats-App-Image-2026-05-19-at-14-46-53.jpg');

background-size:cover;

background-position:center;

}

.chat::before{

content:'';

position:absolute;

inset:0;

background:
linear-gradient(
180deg,
rgba(0,0,0,.34),
rgba(0,0,0,.45)
);

}

.chat::-webkit-scrollbar{

width:5px;

}

.chat::-webkit-scrollbar-thumb{

background:
rgba(255,255,255,.14);

border-radius:20px;

}

/* MESSAGE */

.message{

position:relative;

z-index:2;

width:100%;

background:
linear-gradient(
180deg,
#056162,
#045355
);

border-radius:18px 18px 6px 18px;

overflow:hidden;

border:
1px solid rgba(255,255,255,.04);

box-shadow:
0 18px 45px rgba(0,0,0,.35);

}

/* IMAGE */

.message-image{

display:none;

width:100%;

overflow:hidden;

background:#000;

}

.message-image img{

width:100%;

display:block;

object-fit:cover;

}

/* BODY */

.message-body{

padding:16px 16px 12px;

}

/* TEXTO */

.message-body p{

font-size:14px;

line-height:1.8;

white-space:pre-wrap;

word-break:break-word;

color:#fff;

}

/* FOOTER */

.message-footer{

display:flex;
justify-content:flex-end;
align-items:center;

gap:6px;

margin-top:12px;

font-size:11px;

color:#d1fae5;

}

.message-footer i{

font-size:15px;

color:#86efac;

}

/* RESPONSIVO */

@media(max-width:1100px){

.grid{

grid-template-columns:1fr;

}

.phone{

height:780px;

}

}

@media(max-width:700px){

body{

padding:
12px;

}

.title h1{

font-size:30px;

}

.card{

padding:18px;

border-radius:24px;

}

.buttons{

flex-direction:column;

}

.btn{

width:100%;

}

.top-btn{

flex:1;

}

.phone{

height:720px;

border-radius:26px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="top">

<div class="title">

<div class="title-icon">

<i class="ri-edit-box-fill"></i>

</div>

<div>

<h1>
Editar Campanha
</h1>

<p>
Atualize sua campanha NexZapp em tempo real
</p>

</div>

</div>

<div class="top-actions">

<button
class="top-btn btn-dark"
onclick="voltar()"
>

<i class="ri-arrow-left-line"></i>

Voltar

</button>

<button
class="top-btn btn-primary"
onclick="salvarCampanha()"
>

<i class="ri-save-line"></i>

Salvar Alterações

</button>

</div>

</div>

<div class="grid">

<!-- LEFT -->

<div class="card">

<div class="card-header">

<h2>
Detalhes da Campanha
</h2>

<div class="badge">
LIVE EDIT
</div>

</div>

<div class="form">

<div class="input-group">

<label>
Nome da campanha
</label>

<input
type="text"
class="input"
id="nome"
placeholder="Digite o nome"
/>

</div>

<div class="input-group">

<label>
Mensagem
</label>

<textarea
class="textarea"
id="mensagem"
placeholder="Digite a mensagem..."
></textarea>

</div>

<div class="upload">

<i class="ri-image-add-line"></i>

<p>
Atualizar imagem da campanha
</p>

<input
type="file"
id="imagem"
accept="image/*"
/>

</div>

<div class="buttons">

<button
class="btn save"
onclick="salvarCampanha()"
>

<i class="ri-check-line"></i>

Salvar

</button>

<button
class="btn cancel"
onclick="limparImagem()"
>

<i class="ri-image-line"></i>

Remover Imagem

</button>

<button
class="btn delete"
onclick="deletarCampanha()"
>

<i class="ri-delete-bin-6-line"></i>

Excluir

</button>

</div>

</div>

</div>

<!-- RIGHT -->

<div class="card">

<div class="card-header">

<h2>
Preview Atualizado
</h2>

<div class="badge">
WHATSAPP VIEW
</div>

</div>

<div class="phone">

<div class="phone-top">

<div class="user">

<div class="avatar">
NZ
</div>

<div>

<h3>
NexZapp Oficial
</h3>

<p>
online agora
</p>

</div>

</div>

<div class="phone-icons">

<i class="ri-phone-line"></i>

<i class="ri-video-line"></i>

<i class="ri-more-2-fill"></i>

</div>

</div>

<div class="chat" id="chat">

<div class="message">

<div
class="message-image"
id="messageImage"
>

<img
id="previewImg"
/>

</div>

<div class="message-body">

<p id="previewMessage">
Digite sua mensagem...
</p>

<div class="message-footer">

<span id="hora">
12:00
</span>

<i class="ri-check-double-fill"></i>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

/* STORAGE */

const dados = JSON.parse(

localStorage.getItem(
'editarCampanha'
)

);

/* ELEMENTOS */

const nome =
document.getElementById('nome');

const mensagem =
document.getElementById('mensagem');

const imagem =
document.getElementById('imagem');

const previewMessage =
document.getElementById('previewMessage');

const previewImg =
document.getElementById('previewImg');

const messageImage =
document.getElementById('messageImage');

const chat =
document.getElementById('chat');

/* LOAD */

if(dados){

nome.value =
dados.campanha.nome || '';

mensagem.value =
dados.campanha.mensagem || '';

previewMessage.innerText =
dados.campanha.mensagem || '';

if(dados.campanha.imagem){

previewImg.src =
dados.campanha.imagem;

messageImage.style.display =
'block';

}

}

/* AUTO PREVIEW */

mensagem.addEventListener(
'input',
()=>{

previewMessage.innerText =
mensagem.value ||
'Digite sua mensagem...';

setTimeout(()=>{

chat.scrollTop =
chat.scrollHeight;

},100);

}
);

/* IMAGE */

imagem.addEventListener(
'change',
async()=>{

const file =
imagem.files[0];

if(!file) return;

const base64 =
await toBase64(file);

previewImg.src =
base64;

messageImage.style.display =
'block';

setTimeout(()=>{

chat.scrollTop =
chat.scrollHeight;

},100);

}
);

/* SAVE */

async function salvarCampanha(){

if(!dados) return;

const campanhas = JSON.parse(

localStorage.getItem(
'campanhasNexZapp'
)

) || [];

let novaImagem =
dados.campanha.imagem || '';

if(imagem.files[0]){

novaImagem =
await toBase64(
imagem.files[0]
);

}

campanhas[dados.index] = {

nome:
nome.value.trim(),

mensagem:
mensagem.value.trim(),

imagem:
novaImagem,

data:
new Date().toLocaleDateString(
'pt-BR'
)

};

localStorage.setItem(

'campanhasNexZapp',

JSON.stringify(campanhas)

);

alert(
'Campanha atualizada'
);

voltar();

}

/* DELETE */

function deletarCampanha(){

if(
!confirm(
'Excluir campanha?'
)
) return;

const campanhas = JSON.parse(

localStorage.getItem(
'campanhasNexZapp'
)

) || [];

campanhas.splice(
dados.index,
1
);

localStorage.setItem(

'campanhasNexZapp',

JSON.stringify(campanhas)

);

alert(
'Campanha excluída'
);

voltar();

}

/* REMOVE IMAGE */

function limparImagem(){

previewImg.src = '';

messageImage.style.display =
'none';

dados.campanha.imagem = '';

}

/* BASE64 */

function toBase64(file){

return new Promise((resolve,reject)=>{

const reader =
new FileReader();

reader.readAsDataURL(file);

reader.onload = ()=>{

resolve(reader.result);

};

reader.onerror = error=>{

reject(error);

};

});

}

/* TIME */

const agora = new Date();

document
.getElementById('hora')
.innerText = agora.toLocaleTimeString(
'pt-BR',
{
hour:'2-digit',
minute:'2-digit'
}
);

/* VOLTAR */

function voltar(){

try{

const frame =
window.top.document.getElementById(
'frame'
);

if(frame){

frame.src =
'campanhas.html';

return;

}

}catch(e){}

window.location.href =
'campanhas.html';

}

</script>

</body>
</html>
