<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>NexZapp • Campanhas</title>

<link
href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
rel="stylesheet"
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--green:#22c55e;
--green2:#16a34a;

--bg:#020202;

--card:#080808;

--card2:#050505;

--muted:#6b7280;

--border:
rgba(255,255,255,.05);

}

html,
body{

width:100%;
overflow-x:hidden;

background:#020202;

font-family:'Inter',sans-serif;

color:#fff;

}

body{

min-height:100vh;

padding:
calc(16px + env(safe-area-inset-top))
16px
calc(24px + env(safe-area-inset-bottom));

background:#020202;

}

.container{

width:100%;
max-width:1700px;

margin:auto;

}

/* TOP */

.top{

display:flex;
justify-content:space-between;
align-items:center;

gap:20px;

margin-bottom:24px;

flex-wrap:wrap;

}

.title{

display:flex;
align-items:center;

gap:18px;

}

.title-icon{

width:72px;
height:72px;

border-radius:24px;

background:
linear-gradient(
180deg,
rgba(34,197,94,.12),
rgba(34,197,94,.04)
);

border:
1px solid rgba(34,197,94,.12);

display:flex;
align-items:center;
justify-content:center;

}

.title-icon i{

font-size:32px;

color:var(--green);

}

.title h1{

font-size:38px;

font-weight:900;

letter-spacing:-1px;

}

.title p{

margin-top:5px;

font-size:13px;

color:var(--muted);

}

/* ACTIONS */

.top-actions{

display:flex;
align-items:center;

gap:12px;

flex-wrap:wrap;

}

.search{

position:relative;

}

.search i{

position:absolute;

left:16px;
top:50%;

transform:translateY(-50%);

font-size:18px;

color:#6b7280;

}

.search input{

width:260px;
height:56px;

background:#080808;

border:
1px solid rgba(255,255,255,.05);

border-radius:18px;

outline:none;

padding:
0 18px 0 48px;

font-size:14px;

color:#fff;

}

.new-btn{

height:56px;

padding:0 22px;

border:none;

border-radius:18px;

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

color:#fff;

font-size:13px;

font-weight:800;

display:flex;
align-items:center;

gap:10px;

cursor:pointer;

transition:.2s;

}

.new-btn:hover{

transform:
translateY(-2px);

}

/* STATS */

.stats{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:16px;

margin-bottom:22px;

}

.stat{

background:#080808;

border:
1px solid rgba(255,255,255,.05);

border-radius:26px;

padding:20px;

display:flex;
justify-content:space-between;
align-items:center;

}

.stat-left span{

font-size:12px;

color:#6b7280;

}

.stat-left h2{

margin-top:10px;

font-size:34px;

font-weight:900;

}

.stat-left p{

margin-top:6px;

font-size:12px;

color:#6b7280;

}

.stat-icon{

width:58px;
height:58px;

border-radius:18px;

background:
rgba(34,197,94,.08);

border:
1px solid rgba(34,197,94,.12);

display:flex;
align-items:center;
justify-content:center;

}

.stat-icon i{

font-size:24px;

color:var(--green);

}

/* MAIN */

.main{

background:
linear-gradient(
180deg,
#090909,
#060606
);

border:
1px solid rgba(255,255,255,.05);

border-radius:34px;

padding:24px;

}

/* HEADER */

.main-header{

display:flex;
justify-content:space-between;
align-items:center;

gap:16px;

margin-bottom:22px;

flex-wrap:wrap;

}

.main-left h2{

font-size:26px;

font-weight:900;

}

.main-left p{

margin-top:6px;

font-size:13px;

color:#6b7280;

}

/* RIGHT */

.main-right{

display:flex;
align-items:center;

gap:12px;

flex-wrap:wrap;

}

.badge{

padding:10px 14px;

border-radius:14px;

background:
rgba(34,197,94,.08);

border:
1px solid rgba(34,197,94,.14);

color:#86efac;

font-size:11px;

font-weight:800;

}

.view-all{

height:46px;

padding:0 18px;

border:none;

border-radius:14px;

background:#050505;

border:
1px solid rgba(255,255,255,.05);

color:#fff;

font-size:12px;

font-weight:700;

display:flex;
align-items:center;

gap:10px;

cursor:pointer;

transition:.2s;

}

.view-all:hover{

border-color:
rgba(34,197,94,.15);

transform:
translateY(-1px);

}

/* CAMPAIGNS */

.campaigns{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(260px,1fr));

gap:18px;

}

/* CARD */

.campaign{

background:#050505;

border:
1px solid rgba(255,255,255,.05);

border-radius:26px;

overflow:hidden;

transition:.2s;

}

.campaign:hover{

transform:
translateY(-3px);

border-color:
rgba(34,197,94,.15);

}

/* IMAGE */

.preview{

width:100%;
height:160px;

background:#111;

overflow:hidden;

}

.preview img{

width:100%;
height:100%;

object-fit:cover;

display:block;

}

.preview-empty{

width:100%;
height:100%;

display:flex;
align-items:center;
justify-content:center;

font-size:58px;

color:#2a2a2a;

}

/* BODY */

.body{

padding:18px;

}

.body h3{

font-size:16px;

font-weight:800;

margin-bottom:10px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.body p{

font-size:12px;

line-height:1.7;

color:#9ca3af;

display:-webkit-box;

-webkit-line-clamp:3;
-webkit-box-orient:vertical;

overflow:hidden;

min-height:62px;

margin-bottom:16px;

}

/* META */

.meta{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:16px;

gap:10px;

flex-wrap:wrap;

}

.tag{

padding:8px 12px;

border-radius:12px;

background:
rgba(34,197,94,.08);

border:
1px solid rgba(34,197,94,.12);

color:#86efac;

font-size:10px;

font-weight:800;

}

.date{

font-size:11px;

color:#6b7280;

}

/* ACTIONS */

.actions{

display:flex;

gap:10px;

}

.action-btn{

flex:1;

height:46px;

border:none;

border-radius:16px;

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;

font-size:17px;

transition:.2s;

}

.action-btn:hover{

transform:
translateY(-1px);

}

.use{

background:
linear-gradient(
135deg,
var(--green),
var(--green2)
);

color:#fff;

}

.edit{

background:
rgba(255,255,255,.04);

border:
1px solid rgba(255,255,255,.05);

color:#fff;

}

.delete{

background:
rgba(239,68,68,.10);

border:
1px solid rgba(239,68,68,.12);

color:#f87171;

}

/* EMPTY */

.empty{

height:420px;

display:flex;
align-items:center;
justify-content:center;
flex-direction:column;

gap:14px;

color:#6b7280;

}

.empty i{

font-size:72px;

opacity:.4;

}

/* MOBILE */

@media(max-width:1100px){

.stats{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:700px){

.stats{

grid-template-columns:1fr;

}

.campaigns{

grid-template-columns:1fr;

}

.search{

width:100%;

}

.search input{

width:100%;

}

.top-actions{

width:100%;

}

.title h1{

font-size:30px;

}

.main{

padding:18px;

border-radius:26px;

}

}

</style>

</head>

<body>

<div class="container">

<!-- TOP -->

<div class="top">

<div class="title">

<div class="title-icon">

<i class="ri-megaphone-fill"></i>

</div>

<div>

<h1>
Campanhas
</h1>

<p>
Biblioteca premium NexZapp
</p>

</div>

</div>

<div class="top-actions">

<div class="search">

<i class="ri-search-line"></i>

<input
type="text"
id="searchInput"
placeholder="Pesquisar campanhas..."
/>

</div>

<button
class="new-btn"
onclick="abrirNovaCampanha()"
>

<i class="ri-add-line"></i>

Nova Campanha

</button>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-left">

<span>
Total
</span>

<h2 id="totalCampaigns">
0
</h2>

<p>
Campanhas criadas
</p>

</div>

<div class="stat-icon">

<i class="ri-megaphone-line"></i>

</div>

</div>

<div class="stat">

<div class="stat-left">

<span>
Com mídia
</span>

<h2 id="mediaCampaigns">
0
</h2>

<p>
Campanhas visuais
</p>

</div>

<div class="stat-icon">

<i class="ri-image-line"></i>

</div>

</div>

<div class="stat">

<div class="stat-left">

<span>
Texto
</span>

<h2 id="textCampaigns">
0
</h2>

<p>
Somente mensagem
</p>

</div>

<div class="stat-icon">

<i class="ri-chat-3-line"></i>

</div>

</div>

<div class="stat">

<div class="stat-left">

<span>
Sistema
</span>

<h2>
PRO
</h2>

<p>
Biblioteca ativa
</p>

</div>

<div class="stat-icon">

<i class="ri-database-2-line"></i>

</div>

</div>

</div>

<!-- MAIN -->

<div class="main">

<div class="main-header">

<div class="main-left">

<h2>
Campanhas recentes
</h2>

<p>
Últimas campanhas criadas no sistema
</p>

</div>

<div class="main-right">

<div class="badge">
PREMIUM UI
</div>

<button
class="view-all"
onclick="abrirTodasCampanhas()"
>

<i class="ri-layout-grid-line"></i>

Ver todas

</button>

</div>

</div>

<div
class="campaigns"
id="campaigns"
></div>

</div>

</div>

<script>

/* STORAGE */

let campanhas = JSON.parse(

localStorage.getItem(
'campanhasNexZapp'
)

) || [];

const campaignsDiv =
document.getElementById(
'campaigns'
);

/* NOVA */

function abrirNovaCampanha(){

try{

const frame =
window.top.document.getElementById(
'frame'
);

if(frame){

frame.src =
'criar-campanhas.html';

return;

}

}catch(e){}

window.location.href =
'criar-campanhas.html';

}

/* TODAS */

function abrirTodasCampanhas(){

try{

const frame =
window.top.document.getElementById(
'frame'
);

if(frame){

frame.src =
'todas-campanhas.html';

return;

}

}catch(e){}

window.location.href =
'todas-campanhas.html';

}

/* COUNTERS */

function atualizarContadores(){

document
.getElementById(
'totalCampaigns'
)
.innerText =
campanhas.length;

const midia =
campanhas.filter(c=>c.imagem).length;

document
.getElementById(
'mediaCampaigns'
)
.innerText =
midia;

document
.getElementById(
'textCampaigns'
)
.innerText =
campanhas.length - midia;

}

/* RENDER */

function renderizarCampanhas(lista = campanhas){

atualizarContadores();

if(!lista.length){

campaignsDiv.innerHTML = `

<div class="empty">

<i class="ri-folder-open-line"></i>

<h3>
Nenhuma campanha salva
</h3>

<p>
Crie sua primeira campanha
</p>

</div>

`;

return;

}

campaignsDiv.innerHTML = '';

const recentes =
lista.slice(0,5);

recentes.forEach((campanha,index)=>{

campaignsDiv.innerHTML += `

<div class="campaign">

<div class="preview">

${
campanha.imagem

?

`<img src="${campanha.imagem}">`

:

`

<div class="preview-empty">

<i class="ri-image-line"></i>

</div>

`

}

</div>

<div class="body">

<h3>
${campanha.nome}
</h3>

<p>
${campanha.mensagem}
</p>

<div class="meta">

<div class="tag">
ATIVA
</div>

<div class="date">
${campanha.data || 'Hoje'}
</div>

</div>

<div class="actions">

<button
class="action-btn use"
onclick="visualizarCampanha(${index})"
>

<i class="ri-eye-line"></i>

</button>

<button
class="action-btn edit"
onclick="editarCampanha(${index})"
>

<i class="ri-edit-line"></i>

</button>

<button
class="action-btn delete"
onclick="deletarCampanha(${index})"
>

<i class="ri-delete-bin-6-line"></i>

</button>

</div>

</div>

</div>

`;

});

}

/* VISUALIZAR */

function visualizarCampanha(index){

localStorage.setItem(

'campanhaSelecionada',

JSON.stringify(
campanhas[index]
)

);

try{

const frame =
window.top.document.getElementById(
'frame'
);

if(frame){

frame.src =
'visualizar-campanha.html';

return;

}

}catch(e){}

window.location.href =
'visualizar-campanha.html';

}

/* EDITAR */

function editarCampanha(index){

localStorage.setItem(

'editarCampanha',

JSON.stringify({

campanha:
campanhas[index],

index

})

);

try{

const frame =
window.top.document.getElementById(
'frame'
);

if(frame){

frame.src =
'editar-campanha.html';

return;

}

}catch(e){}

window.location.href =
'editar-campanha.html';

}

/* DELETE */

function deletarCampanha(index){

const confirmar =
confirm(
'Deseja excluir esta campanha?'
);

if(!confirmar) return;

campanhas.splice(index,1);

localStorage.setItem(

'campanhasNexZapp',

JSON.stringify(campanhas)

);

renderizarCampanhas();

}

/* SEARCH */

document
.getElementById(
'searchInput'
)
.addEventListener(
'input',
function(){

const valor =
this.value.toLowerCase();

const filtradas =

campanhas.filter(c=>

c.nome
.toLowerCase()
.includes(valor)

||

c.mensagem
.toLowerCase()
.includes(valor)

);

renderizarCampanhas(
filtradas
);

}
);

/* INIT */

renderizarCampanhas();

</script>

</body>
</html>
